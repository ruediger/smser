name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read


jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt -- --check

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [
          "",
          "--no-default-features",
          "--no-default-features --features server"
        ]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose ${{ matrix.features }}
      - name: Run tests
        run: cargo test --verbose ${{ matrix.features }}
      - name: Run clippy
        run: cargo clippy --verbose --all-targets ${{ matrix.features }} -- -D warnings

  # Single aggregate check for branch protection to require. Matrix jobs report
  # under generated names like "Build & Test (--no-default-features)", so
  # requiring them directly breaks whenever the matrix changes.
  ci-success:
    name: CI
    if: always()
    needs: [fmt, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure')
                  || contains(needs.*.result, 'cancelled')
                  || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more jobs did not succeed."
            exit 1
          fi
          echo "All jobs succeeded."